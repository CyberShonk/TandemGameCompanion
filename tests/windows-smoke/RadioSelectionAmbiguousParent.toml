config_version = 1

[launcher]
log_file = "RadioSelectionAmbiguousParent.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Failure Game"
path = "SmokeGame.exe"
arguments = ["radio-ambiguousparent-events.txt", "radio-ambiguous-parent-game-start", "0", "radio-ambiguous-parent-game-end"]
working_directory = "."

[[tools]]
name = "Ambiguous Radio Parent Tool"
path = "RadioTool.exe"
arguments = ["radio-ambiguousparent-events.txt", "ambiguous-parent", "Ambiguous Radio Parent", "5001", "0", "0", "5000"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Ambiguous Radio Parent"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 2000
