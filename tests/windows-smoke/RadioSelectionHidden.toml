config_version = 1

[launcher]
log_file = "RadioSelectionHidden.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Failure Game"
path = "SmokeGame.exe"
arguments = ["radio-hidden-events.txt", "radio-hidden-game-start", "0", "radio-hidden-game-end"]
working_directory = "."

[[tools]]
name = "Radio Hidden Tool"
path = "RadioTool.exe"
arguments = ["radio-hidden-events.txt", "hidden", "Hidden Radio Trainer", "5001", "0", "0", "5000"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Hidden Radio Trainer"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 500
