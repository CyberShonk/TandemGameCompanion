config_version = 1

[launcher]
log_file = "ButtonWrongRuntimeClass.log"
continue_on_optional_tool_failure = true

[game]
name = "Wrong Runtime Class Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-wrong-runtime-class-events.txt", "button-wrong-runtime-class-game-start", "0"]
working_directory = "."

[[tools]]
name = "Wrong Runtime Class Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-wrong-runtime-class-events.txt",
  "wrong-runtime-class",
  "Wrong Runtime Class Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Wrong Runtime Class Button Trainer"
control_id = 2001
timeout_ms = 2000
