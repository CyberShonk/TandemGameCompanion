config_version = 1

[launcher]
log_file = "CheckboxAmbiguousControl.log"
continue_on_optional_tool_failure = true

[game]
name = "Checkbox Failure Game"
path = "SmokeGame.exe"
arguments = ["checkbox-ambiguous-control-events.txt", "checkbox-ambiguous-control-game-start", "0"]
working_directory = "."

[[tools]]
name = "Ambiguous Checkbox Control Tool"
path = "CheckboxTool.exe"
arguments = [
  "checkbox-ambiguous-control-events.txt",
  "ambiguous-control",
  "Ambiguous Checkbox Control",
  "3001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "set-checkbox-state"
window_title_equals = "Ambiguous Checkbox Control"
control_id = 3001
checked = true
timeout_ms = 2000
