config_version = 1

[launcher]
log_file = "RadioSelectionCheckbox.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Failure Game"
path = "SmokeGame.exe"
arguments = ["radio-checkbox-events.txt", "radio-checkbox-game-start", "0", "radio-checkbox-game-end"]
working_directory = "."

[[tools]]
name = "Checkbox Radio Rejection Tool"
path = "RadioTool.exe"
arguments = ["radio-checkbox-events.txt", "checkbox", "Checkbox Radio Rejection Trainer", "5001", "0", "0", "5000"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Checkbox Radio Rejection Trainer"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 2000
