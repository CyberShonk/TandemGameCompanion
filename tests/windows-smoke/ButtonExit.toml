config_version = 1

[launcher]
log_file = "ButtonExit.log"

[game]
name = "Button Exit Game"
path = "SmokeGame.exe"
arguments = ["button-exit-events.txt", "button-exit-game-start", "0"]
working_directory = "."

[[tools]]
name = "Exiting Button Tool"
path = "SmokeTool.exe"
arguments = ["button-exit-events.txt", "button-tool-exit", "100"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Never Created Button Trainer"
control_id = 2001
timeout_ms = 2000
