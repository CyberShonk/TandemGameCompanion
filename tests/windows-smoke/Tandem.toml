config_version = 1

[launcher]
log_file = "Tandem.log"
allow_external_paths = false
continue_on_optional_tool_failure = true

[game]
name = "Smoke Test Game"
path = "SmokeGame.exe"
arguments = [
  "smoke-events.txt",
  "game-start",
  "3000",
  "game-end"
]
working_directory = "."

[[tools]]
name = "Impostor Window Tool"
path = "WindowTool.exe"
arguments = [
  "smoke-events.txt",
  "impostor",
  "Shared Trainer Window",
  "0",
  "10000"
]
working_directory = "."
launch = "before-game"
delay_ms = 0
required = true
close_when_game_exits = true

[[tools]]
name = "Scoped Window Tool"
path = "WindowTool.exe"
arguments = [
  "smoke-events.txt",
  "scoped",
  "Shared Trainer Window",
  "750",
  "10000"
]
working_directory = "."
launch = "before-game"
delay_ms = 2000
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "wait-for-window"
title_equals = "Shared Trainer Window"
timeout_ms = 5000

[[tools]]
name = "Impostor Control Tool"
path = "ControlTool.exe"
arguments = [
  "smoke-events.txt",
  "impostor",
  "Scoped Trainer Controls",
  "1001",
  "10000"
]
working_directory = "."
launch = "before-game"
delay_ms = 0
required = true
close_when_game_exits = true

[[tools]]
name = "Scoped Control Tool"
path = "ControlTool.exe"
arguments = [
  "smoke-events.txt",
  "scoped",
  "Scoped Trainer Controls",
  "1001",
  "750",
  "750",
  "10000"
]
working_directory = "."
launch = "before-game"
delay_ms = 1000
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "wait-for-window"
title_equals = "Scoped Trainer Controls"
timeout_ms = 5000

[[tools.prepare]]
action = "wait-for-control"
window_title_contains = "Scoped Trainer"
control_class_equals = "ComboBox"
control_id = 1001
timeout_ms = 5000

[[tools]]
name = "Before CMD Tool"
path = "BeforeTool.cmd"
arguments = ["before-cmd-arg"]
working_directory = "."
launch = "before-game"
before_game_wait = "tool-exit"
delay_ms = 0
required = true
close_when_game_exits = false

[[tools]]
name = "After BAT Tool"
path = "AfterTool.bat"
arguments = ["after-bat-arg"]
working_directory = "."
launch = "after-game"
delay_ms = 100
required = true
close_when_game_exits = false

[[tools]]
name = "Companion EXE Tool"
path = "SmokeTool.exe"
arguments = [
  "smoke-events.txt",
  "exe-tool",
  "0"
]
working_directory = "."
launch = "after-game"
delay_ms = 200
required = true
close_when_game_exits = false
