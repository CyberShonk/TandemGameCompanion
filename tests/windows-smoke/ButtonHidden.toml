config_version = 1

[launcher]
log_file = "ButtonHidden.log"
continue_on_optional_tool_failure = true

[game]
name = "Hidden Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-hidden-events.txt", "button-hidden-game-start", "0"]
working_directory = "."

[[tools]]
name = "Hidden Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-hidden-events.txt",
  "hidden",
  "Hidden Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Hidden Button Trainer"
control_id = 2001
timeout_ms = 300
