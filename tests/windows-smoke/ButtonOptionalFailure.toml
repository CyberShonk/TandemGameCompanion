config_version = 1

[launcher]
log_file = "ButtonOptionalFailure.log"
continue_on_optional_tool_failure = true

[game]
name = "Optional Checkbox Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-optional-events.txt", "button-optional-game-start", "0"]
working_directory = "."

[[tools]]
name = "Optional Checkbox Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-optional-events.txt",
  "checkbox",
  "Optional Checkbox Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = false
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Optional Checkbox Button Trainer"
control_id = 2001
timeout_ms = 2000
