config_version = 1

[launcher]
log_file = "RadioSelectionExit.log"

[game]
name = "Radio Exit Game"
path = "SmokeGame.exe"
arguments = ["radio-exit-events.txt", "radio-exit-game-start", "0"]
working_directory = "."

[[tools]]
name = "Radio Exit Tool"
path = "SmokeTool.exe"
arguments = ["radio-exit-events.txt", "radio-tool-exit", "100"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Never Created Radio Trainer"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 2000
