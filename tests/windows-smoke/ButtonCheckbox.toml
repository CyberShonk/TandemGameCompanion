config_version = 1

[launcher]
log_file = "ButtonCheckbox.log"
continue_on_optional_tool_failure = true

[game]
name = "Checkbox Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-checkbox-events.txt", "button-checkbox-game-start", "0"]
working_directory = "."

[[tools]]
name = "Checkbox Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-checkbox-events.txt",
  "checkbox",
  "Checkbox Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Checkbox Button Trainer"
control_id = 2001
timeout_ms = 2000
