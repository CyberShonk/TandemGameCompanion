config_version = 1

[launcher]
log_file = "CheckboxWrongRuntimeClass.log"
continue_on_optional_tool_failure = true

[game]
name = "Checkbox Failure Game"
path = "SmokeGame.exe"
arguments = ["checkbox-wrong-runtime-class-events.txt", "checkbox-wrong-runtime-class-game-start", "0"]
working_directory = "."

[[tools]]
name = "Wrong Runtime Class Checkbox Trainer Tool"
path = "CheckboxTool.exe"
arguments = [
  "checkbox-wrong-runtime-class-events.txt",
  "wrong-runtime-class",
  "Wrong Runtime Class Checkbox Trainer",
  "3001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "set-checkbox-state"
window_title_equals = "Wrong Runtime Class Checkbox Trainer"
control_id = 3001
checked = true
timeout_ms = 2000
