config_version = 1

[launcher]
log_file = "ControlExit.log"
allow_external_paths = false
continue_on_optional_tool_failure = true

[game]
name = "Control Exit Game"
path = "SmokeGame.exe"
arguments = [
  "control-exit-events.txt",
  "control-exit-game-start",
  "0"
]
working_directory = "."

[[tools]]
name = "Control Exit Tool"
path = "SmokeTool.exe"
arguments = [
  "control-exit-events.txt",
  "control-exit-tool-start",
  "200"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "wait-for-control"
window_title_contains = "Never Appears"
control_id = 1001
timeout_ms = 3000
