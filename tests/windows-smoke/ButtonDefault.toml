config_version = 1

[launcher]
log_file = "ButtonDefault.log"

[game]
name = "Default Button Game"
path = "SmokeGame.exe"
arguments = ["button-default-events.txt", "button-default-game-start", "0"]
working_directory = "."

[[tools]]
name = "Default Push Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-default-events.txt",
  "default",
  "Default Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
before_game_wait = "tool-exit"
required = true
close_when_game_exits = false

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Default Button Trainer"
control_id = 2001
timeout_ms = 2000
