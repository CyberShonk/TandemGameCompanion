config_version = 1

[launcher]
log_file = "CheckboxRadio.log"
continue_on_optional_tool_failure = true

[game]
name = "Checkbox Failure Game"
path = "SmokeGame.exe"
arguments = ["checkbox-radio-events.txt", "checkbox-radio-game-start", "0"]
working_directory = "."

[[tools]]
name = "Radio Checkbox Trainer Tool"
path = "CheckboxTool.exe"
arguments = [
  "checkbox-radio-events.txt",
  "radio",
  "Radio Checkbox Trainer",
  "3001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "set-checkbox-state"
window_title_equals = "Radio Checkbox Trainer"
control_id = 3001
checked = true
timeout_ms = 2000
