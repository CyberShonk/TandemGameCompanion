config_version = 1

[launcher]
log_file = "ButtonDisabled.log"
continue_on_optional_tool_failure = true

[game]
name = "Disabled Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-disabled-events.txt", "button-disabled-game-start", "0"]
working_directory = "."

[[tools]]
name = "Disabled Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-disabled-events.txt",
  "disabled",
  "Disabled Button Trainer",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Disabled Button Trainer"
control_id = 2001
timeout_ms = 300
