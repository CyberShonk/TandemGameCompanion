config_version = 1

[launcher]
log_file = "RadioSelectionOwnerDraw.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Failure Game"
path = "SmokeGame.exe"
arguments = ["radio-ownerdraw-events.txt", "radio-ownerdraw-game-start", "0", "radio-ownerdraw-game-end"]
working_directory = "."

[[tools]]
name = "Ownerdraw Radio Tool"
path = "RadioTool.exe"
arguments = ["radio-ownerdraw-events.txt", "ownerdraw", "Ownerdraw Radio Trainer", "5001", "0", "0", "5000"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Ownerdraw Radio Trainer"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 2000
