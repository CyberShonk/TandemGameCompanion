config_version = 1

[launcher]
log_file = "ButtonAmbiguousParent.log"
continue_on_optional_tool_failure = true

[game]
name = "Ambiguous Parent Button Tool Game"
path = "SmokeGame.exe"
arguments = ["button-ambiguous-parent-events.txt", "button-ambiguous-parent-game-start", "0"]
working_directory = "."

[[tools]]
name = "Ambiguous Parent Button Tool"
path = "ButtonTool.exe"
arguments = [
  "button-ambiguous-parent-events.txt",
  "ambiguous-parent",
  "Ambiguous Button Parent",
  "2001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "invoke-button"
window_title_equals = "Ambiguous Button Parent"
control_id = 2001
timeout_ms = 2000
