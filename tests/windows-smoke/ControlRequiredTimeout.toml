config_version = 1

[launcher]
log_file = "ControlRequiredTimeout.log"
allow_external_paths = false
continue_on_optional_tool_failure = true

[game]
name = "Required Timeout Game"
path = "SmokeGame.exe"
arguments = [
  "control-required-timeout-events.txt",
  "control-required-timeout-game-start",
  "0"
]
working_directory = "."

[[tools]]
name = "Required Control Timeout Tool"
path = "ControlTool.exe"
arguments = [
  "control-required-timeout-events.txt",
  "impostor",
  "Required Timeout Window",
  "1001",
  "10000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "wait-for-control"
window_title_equals = "Required Timeout Window"
control_class_equals = "ComboBox"
control_id = 9999
timeout_ms = 300
