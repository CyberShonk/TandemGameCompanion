config_version = 1

[launcher]
log_file = "CheckboxAmbiguousParent.log"
continue_on_optional_tool_failure = true

[game]
name = "Checkbox Failure Game"
path = "SmokeGame.exe"
arguments = ["checkbox-ambiguous-parent-events.txt", "checkbox-ambiguous-parent-game-start", "0"]
working_directory = "."

[[tools]]
name = "Ambiguous Checkbox Parent Tool"
path = "CheckboxTool.exe"
arguments = [
  "checkbox-ambiguous-parent-events.txt",
  "ambiguous-parent",
  "Ambiguous Checkbox Parent",
  "3001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "set-checkbox-state"
window_title_equals = "Ambiguous Checkbox Parent"
control_id = 3001
checked = true
timeout_ms = 2000
