config_version = 1

[launcher]
log_file = "RadioSelectionAmbiguousControl.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Failure Game"
path = "SmokeGame.exe"
arguments = ["radio-ambiguouscontrol-events.txt", "radio-ambiguous-control-game-start", "0", "radio-ambiguous-control-game-end"]
working_directory = "."

[[tools]]
name = "Ambiguous Radio Control Tool"
path = "RadioTool.exe"
arguments = ["radio-ambiguouscontrol-events.txt", "ambiguous-control", "Ambiguous Control Radio Trainer", "5001", "0", "0", "5000"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Ambiguous Control Radio Trainer"
control_id = 5001
control_class_equals = "Button"
timeout_ms = 2000
