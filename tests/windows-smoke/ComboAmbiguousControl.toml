config_version = 1

[launcher]
log_file = "ComboAmbiguousControl.log"

[game]
name = "Ambiguous Control Game"
path = "SmokeGame.exe"
arguments = ["combo-ambiguous-control-events.txt", "combo-ambiguous-control-game-start", "0"]
working_directory = "."

[[tools]]
name = "Ambiguous Control Combo Tool"
path = "ComboTool.exe"
arguments = [
  "combo-ambiguous-control-events.txt",
  "ambiguous-control",
  "Ambiguous Combo Controls",
  "1001",
  "0",
  "0",
  "5000"
]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "select-combo-box-index"
window_title_equals = "Ambiguous Combo Controls"
control_class_equals = "ComboBox"
control_id = 1001
selected_index = 2
timeout_ms = 2000
