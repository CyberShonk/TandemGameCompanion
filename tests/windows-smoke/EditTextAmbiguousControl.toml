config_version = 1

[launcher]
log_file = "EditTextAmbiguousControl.log"
allow_external_paths = false
continue_on_optional_tool_failure = true

[game]
name = "Edit Smoke Game"
path = "SmokeGame.exe"
arguments = ["edit-events.txt", "should-not-start", "100", "should-not-start-end"]
working_directory = "."

[[tools]]
name = "Edit Ambiguous Control Tool"
path = "EditTool.exe"
arguments = ["edit-events.txt", "ambiguous-control", "Ambiguous Control Edit Trainer", "4001", "0", "0", "3000"]
working_directory = "."
launch = "before-game"
before_game_wait = "none"
delay_ms = 0
required = true
close_when_game_exits = true

[[tools.prepare]]
action = "set-edit-text"
window_title_equals = "Ambiguous Control Edit Trainer"
control_id = 4001
text = "changed"
timeout_ms = 2000
control_class_equals = "Edit"
