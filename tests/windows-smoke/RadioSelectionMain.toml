config_version = 1

[launcher]
log_file = "RadioSelectionMain.log"
continue_on_optional_tool_failure = true

[game]
name = "Radio Selection Smoke Game"
path = "SmokeGame.exe"
arguments = ["radio-events.txt", "radio-main-game-start", "0", "radio-main-game-end"]
working_directory = "."

[[tools]]
name = "Radio Impostor Tool"
path = "RadioTool.exe"
arguments = ["radio-events.txt", "impostor", "Scoped Radio Trainer", "5001", "0", "0", "2200"]
working_directory = "."
launch = "before-game"
required = true
close_when_game_exits = true

[[tools]]
name = "Scoped Radio Tool"
path = "RadioTool.exe"
arguments = ["radio-events.txt", "scoped", "Scoped Radio Trainer", "5001", "300", "300", "5000"]
working_directory = "."
launch = "before-game"
delay_ms = 500
before_game_wait = "tool-exit"
required = true
close_when_game_exits = false

[[tools.prepare]]
action = "wait-for-window"
title_equals = "Scoped Radio Trainer"
timeout_ms = 5000

[[tools.prepare]]
action = "wait-for-control"
window_title_equals = "Scoped Radio Trainer"
control_class_equals = "Button"
control_id = 5001
timeout_ms = 5000

[[tools.prepare]]
action = "select-radio-button"
window_title_contains = "Scoped Radio Trainer"
control_class_equals = "Button"
control_id = 5001
timeout_ms = 5000

[[tools]]
name = "Radio No-op Tool"
path = "RadioTool.exe"
arguments = ["radio-events.txt", "noop-selected", "Already Selected Radio Trainer", "5002", "0", "0", "700"]
working_directory = "."
launch = "before-game"
delay_ms = 1000
before_game_wait = "tool-exit"
required = true
close_when_game_exits = false

[[tools.prepare]]
action = "select-radio-button"
window_title_equals = "Already Selected Radio Trainer"
control_id = 5002
timeout_ms = 5000
